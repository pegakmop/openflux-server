# Nginx fragments for the OpenFlux control plane.
# Include this inside your server{} block (after TLS config if using https).
#
# Recommended split:
#   /admin/*  -> Bun       (SvelteKit panel, controlplane/web, :3000)
#   /v1/*     -> Go service (controlplane, :8080)
# A false /healthz probe is only handled by the Go service.

location /admin/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /v1/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# OPTIONAL: panel's own health the orchestrator can probe on this proxy
location = /healthz {
    proxy_pass http://127.0.0.1:8080/healthz;
    proxy_set_header Host $host;
}